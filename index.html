<script>
const WORKER_OK='${Ol}';
const API_BASE='${Dn}';
let cfg={capa:true};
let posts=[];let currentPage=1;let adsConfig=null;let adsSeq=[];let adsIndex=0;let liked={};
async function fetchViaWorkerOK(url){
  try{
    const target=url.startsWith('http')?url:'https://myzlandia.blogspot.com'+url;
    const r=await fetch(WORKER_OK+'/?url='+encodeURIComponent(target));
    if(!r.ok) throw 0;
    return await r.json();
  }catch(e){console.warn('worker fail',e);return null;}
}
function getAdsConfig(){return adsConfig||{enabled:true,skip:5,ads:[]};}
function getAdsSeq(){return adsSeq.length?adsSeq:(getAdsConfig().ads||[]);}
function getPageFromPath(){
  const m=location.pathname.match(/\\/page\\/(\\d+)/);
  if(m) return parseInt(m[1],10);
  const q=new URLSearchParams(location.search).get('page');
  return q?parseInt(q,10):1;
}
function getIdFromPath(){
  const p=location.pathname;
  let m=p.match(/\\/(?:p|video|watch|v)\\/([^\\/\\?]+)/);
  if(m) return m[1];
  const q=new URLSearchParams(location.search).get('v')||new URLSearchParams(location.search).get('id');
  return q||null;
}
function isVideoPage(){return !!getIdFromPath();}
async function loadRealPosts(page=1){
  currentPage=page;
  const grid=document.getElementById('grid');
  if(grid) grid.innerHTML='<div class="col-span-full py-20 text-center opacity-60">Carregando...</div>';
  try{
    let data=null;
    try{const r=await fetch(API_BASE+'/api/pages/'+page);if(r.ok) data=await r.json();}catch{}
    let list=data&&(data.posts||data.items||data);
    if(!Array.isArray(list)||!list.length){
      const w=await fetchViaWorkerOK('/page/'+page);
      list=w&&(w.posts||w.items)||[];
    }
    if(!list.length&&page===1){
      list=Array.from({length:12},(_,i)=>({id:'demo-'+i,title:'Vídeo MyZlandia '+(i+1)+' - Final Ajuste Corrigido',thumb:'https://picsum.photos/seed/myzfinal'+i+'/480/270',duration:(Math.floor(Math.random()*10)+1)+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),views:Math.floor(Math.random()*8000)+200,hasCC:i%3===0,vtt:i%3===0?'WEBVTT\\n\\n00:00:00.000 --> 00:00:02.000\\nOlá':'',videoUrl:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'}));
    }
    posts=list;
    renderGrid(list);
    loadViews(list);
  }catch(e){if(grid) grid.innerHTML='<div class="col-span-full py-20 text-center">Erro</div>';}
}
function renderGrid(list){
  const grid=document.getElementById('grid');
  if(!grid) return;
  if(!list.length){
    if(currentPage>1){currentPage--;loadRealPosts(currentPage);return;}
    grid.innerHTML='<div class="col-span-full py-20 text-center opacity-60">Nenhum vídeo</div>';return;
  }
  grid.innerHTML=list.map(p=>{
    const capa=p.thumb||p.capa||(p.cfg&&p.cfg.capa)||'';
    const hasCC=!!(p.hasCC||(p.vtt&&p.vtt.length>10));
    const dur=p.duration||p.time||'0:00';
    const views=p.views?p.views+' views':'';
    return '<article class="group" data-id="'+p.id+'" onclick="openVideo(\\''+p.id+'\\')"><div class="relative aspect-[16/9] overflow-hidden rounded-[12px] bg-[#12162a] border border-[#1e2542]"><img src="'+capa+'" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-[1.03] transition duration-300"><span class="badge-views">'+views+'</span><span class="badge-time">'+dur+'</span>'+(hasCC?'<span class="badge-cc">CC</span>':'')+'</div><h3 class="mt-[8px] text-[13px] md:text-[14px] leading-[1.3] line-clamp-2 text-[#d0d8f0] group-hover:text-white">'+(p.title||'')+'</h3></article>';
  }).join('');
  renderPagination();

async function loadViews(list){
  try{
    const ids=list.map(p=>p.id).join(',');
    const r=await fetch(API_BASE+'/api/views?ids='+encodeURIComponent(ids));
    if(!r.ok) return;
    const map=await r.json();
    document.querySelectorAll('.badge-views').forEach((el,i)=>{const id=list[i]?.id;if(map[id]!=null) el.textContent=map[id]+' views';});
  }catch{}
}
function renderPagination(){
  const el=document.getElementById('pagination');
  if(!el) return;
  el.innerHTML='<button onclick="changePage('+(currentPage-1)+')" '+(currentPage<=1?'disabled':'')+' class="px-4 py-2 rounded-full bg-[#1a2a55] disabled:opacity-30 text-[13px]">Anterior</button><span class="text-[13px] opacity-70">Página '+currentPage+'</span><button onclick="changePage('+(currentPage+1)+')" class="px-4 py-2 rounded-full bg-white text-black text-[13px]">Próxima</button>';

function changePage(p){if(p<1) return;history.pushState(null,'',p===1?'/':'/page/'+p);loadRealPosts(p);}

async function showVideoPage(id){
  const wrap=document.getElementById('playerWrap');
  const gridSec=document.getElementById('gridSection');
  const vidSec=document.getElementById('videoSection');
  if(wrap) wrap.classList.remove('hidden');
  if(gridSec) gridSec.classList.add('hidden');
  if(vidSec) vidSec.classList.remove('hidden');
  document.getElementById('loadingCircle')?.classList.remove('hidden');
  const data=await getPostDataById(id);
  if(!data){document.getElementById('loadingCircle')?.classList.add('hidden');return;}
  document.getElementById('videoTitle').textContent=data.title||'Vídeo';
  document.getElementById('viewCount').textContent=(data.views||'')+' views';
  document.getElementById('ccBadge').classList.toggle('hidden',!(data.hasCC||(data.vtt&&data.vtt.length>10)));
  document.getElementById('tags').innerHTML=(data.tags||['myzlandia','final']).map(t=>'<span class="text-[11px] px-2 py-1 rounded-full bg-[#1a2a55]">#'+t+'</span>').join('');
  playWithAds(data);
  renderRelated(data);
}

async function playWithAds(videoData){
  const mv=document.getElementById('myzPlayer');
  const ao=document.getElementById('adsOverlay');
  const lc=document.getElementById('loadingCircle');
  try{const cfgAds=await fetch(API_BASE+'/api/ads').then(r=>r.json()).catch(()=>null);if(cfgAds){adsConfig=cfgAds;adsSeq=cfgAds.sequence||cfgAds.ads||[];}}catch{}

  if(lc) lc.classList.add('hidden');
}
function nextAd(videoData){
  const seq=getAdsSeq();
  const av=document.getElementById('adsVideo');
  const ao=document.getElementById('adsOverlay');
  const info=document.getElementById('adsInfo');
  if(adsIndex>=seq.length){if(ao) ao.style.display='none';playMain(videoData);return;}

}

});
